idth="170" height="28" x="-85" y="-14" fill="#1e293b" stroke="#475569" stroke-width="1" rx="14"/><circle cx="-62" cy="0" r="5" fill="#22c55e" filter="url(#glow)"/><text x="-48" y="4.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">OBSERVABILITY &amp; APM</text></g><g filter="url(#softGlow)"><text x="460" y="108" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome Workflow Execution</text><text x="460" y="146" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-.5" text-anchor="middle">Analytics &amp; Metrics</text></g><text x="460" y="182" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Curated telemetry, execution tracking, latency profiling &amp; observability for automated pipelines</text><g transform="translate(460, 214)"><rect width="102" height="23" x="-165" y="-12" fill="#0f172a" stroke="#38bdf8" stroke-width=".9" opacity=".95" rx="11.5"/><text x="-114" y="3.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Real-time Telemetry</text><rect width="106" height="23" x="-53" y="-12" fill="#0f172a" stroke="#818cf8" stroke-width=".9" opacity=".95" rx="11.5"/><text x="0" y="3.5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">📊 OpenTelemetry / APM</text><rect width="102" height="23" x="63" y="-12" fill="#0f172a" stroke="#c084fc" stroke-width=".9" opacity=".95" rx="11.5"/><text x="114" y="3.5"