<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 920 250"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".8"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="10"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-opacity=".08" stroke-width=".5" d="M 30 0 L 0 0 0 30"/><circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity=".15"/></pattern><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}@keyframes flowData{0%{stroke-dashoffset:120}}@keyframes pulseBar1{0%{height:26px;y:154px}50%{height:42px;y:138px}}@keyframes pulseBar2{0%{height:48px;y:132px}50%{height:30px;y:150px}}@keyframes pulseBar3{0%{height:36px;y:144px}50%{height:56px;y:124px}}@keyframes pulseBar4{0%{height:60px;y:120px}50%{height:38px;y:142px}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.3}50%{transform:translateY(-8px);opacity:.9}}@keyframes scanBeam{0%{transform:translateX(-100px);opacity:0}50%{opacity:.4}}.node-pulse{animation:pulseNode 3s ease-in-out infinite;transform-origin:center}.data-stream{stroke-dasharray:6 6;animation:flowData 2.5s linear infinite}.bar-1{animation:pulseBar1 3s ease-in-out infinite}.bar-2{animation:pulseBar2 2.6s ease-in-out infinite}.bar-3{animation:pulseBar3 3.4s ease-in-out infinite}.bar-4{animation:pulseBar4 2.8s ease-in-out infinite}.particle{animation:floatParticle 4s ease-in-out infinite}.scanner{animation:scanBeam 6s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><line x1="0" x2="0" y1="0" y2="250" stroke="url(#lineGrad)" stroke-width="2" class="scanner"/><circle cx="120" cy="50" r="100" fill="#38bdf8" filter="url(#softGlow)" opacity=".08"/><circle cx="820" cy="180" r="120" fill="#a855f7" filter="url(#softGlow)" opacity=".08"/><g opacity=".75"><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M 45 70 L 110 70 L 145 125 L 85 180 L 140 180" class="data-stream"/><path fill="none" stroke="#818cf8" stroke-width="1.8" d="M 110 70 L 175 70" class="data-stream" style="animation-duration:3s"/><path fill="none" stroke="#c084fc" stroke-width="1.8" d="M 145 125 L 210 125" class="data-stream" style="animation-duration:2s"/><circle cx="45" cy="70" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><circle cx="45" cy="70" r="3" fill="#38bdf8" class="node-pulse"/><circle cx="110" cy="70" r="9" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><circle cx="110" cy="70" r="3.5" fill="#818cf8" class="node-pulse"/><circle cx="175" cy="70" r="7" fill="#1e293b" stroke